    --text: #eef2f6; --muted: #8a94a3; --accent: #3e7bb6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: var(--muted); max-width: 420px; }
  a.back {
    margin-top: 10px; color: var(--accent); text-decoration: none;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; font-size: 14px;
  }
  a.back:hover { border-color: var(--accent); }
</style>
</head>
