<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bw-tools.ch</title>
<style>
  :root {
    --bg: #050608;
    --panel: #121620;
    --panel-hover: #182030;
    --line: #242c38;
    --accent: #3e7bb6;
    --accent-soft: rgba(62, 123, 182, .16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: clamp(14px, 4vw, 26px);
    width: 100%; max-width: 760px;
  }
  @media (min-width: 480px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }

  .tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(6px, 1.8vw, 10px);
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    text-decoration: none;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  a.tile:hover, a.tile:focus-visible { background: var(--panel-hover); border-color: var(--accent); transform: translateY(-3px); }

  .tile .icon-wrap {
    width: 54%; height: 54%;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  .tile .icon-wrap svg { width: 100%; height: 100%; }

  .tile .tile-label {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: clamp(11px, 2.6vw, 14px);
    font-weight: 500;
    letter-spacing: .01em;
    color: #c7cfda;
  }

  .tile.placeholder { background: transparent; border: 1.5px dashed var(--line); cursor: default; }
  .tile.placeholder .icon-wrap { color: #333d4a; }
</style>
</head>
<body>

<div class="grid">

  <a class="tile" href="/ladeplan/">
    <span class="icon-wrap">
      <!-- Container-Portalkran (Hafenkran) mit haengendem Container -->
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 34 V11" stroke="currentColor" stroke-width="2"/>
        <path d="M32 34 V11" stroke="currentColor" stroke-width="2"/>
        <path d="M5 11 H35" stroke="currentColor" stroke-width="2"/>
        <path d="M4 34 H12 M28 34 H36" stroke="currentColor" stroke-width="2"/>
        <rect x="16.5" y="9" width="7" height="3" rx="0.8" stroke="currentColor" stroke-width="1.4"/>
        <path d="M20 12.5 V17" stroke="currentColor" stroke-width="1.4"/>
        <rect x="11" y="17" width="18" height="11" rx="1.3" stroke="currentColor" stroke-width="2"/>
        <path d="M15 17 V28 M20 17 V28 M25 17 V28" stroke="currentColor" stroke-width="1" opacity=".5"/>
      </svg>
    </span>
    <span class="tile-label">Ladeplan</span>
  </a>

  <a class="tile" href="/etiketten/">
    <span class="icon-wrap">
      <!-- Etikett / Anhaenger -->
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 5.5 H31.5 A3 3 0 0 1 34.5 8.5 V19.5 A3 3 0 0 1 33.6 21.6 L21.6 33.6 A3 3 0 0 1 17.4 33.6 L6.4 22.6 A3 3 0 0 1 6.4 18.4 L18.4 6.4 A3 3 0 0 1 20.5 5.5 Z" stroke="currentColor" stroke-width="2"/>
        <circle cx="28" cy="12" r="2.6" stroke="currentColor" stroke-width="2"/>
        <path d="M14 20 L20 26 M18 16 L24 22" stroke="currentColor" stroke-width="1.6" opacity=".55"/>
      </svg>
    </span>
    <span class="tile-label">Etiketten</span>
  </a>

  <a class="tile" href="/zuschnitt/">
    <span class="icon-wrap">
      <!-- Zuschnittplan: Platte mit eingeteilten Zuschnitten -->
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="8" width="32" height="24" rx="1.6" stroke="currentColor" stroke-width="2"/>
        <rect x="7.5" y="11.5" width="10" height="17" stroke="currentColor" stroke-width="1.5"/>
        <rect x="20.5" y="11.5" width="12" height="7.5" stroke="currentColor" stroke-width="1.5"/>
        <rect x="20.5" y="22" width="6.5" height="6.5" stroke="currentColor" stroke-width="1.5"/>
        <rect x="30" y="22" width="2.5" height="6.5" stroke="currentColor" stroke-width="1.5" opacity=".5"/>
      </svg>
    </span>
    <span class="tile-label">Zuschnitt</span>
  </a>

  <div class="tile placeholder" aria-disabled="true">
    <span class="icon-wrap">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="20" height="20" rx="4" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3.5"/>
      </svg>
    </span>
  </div>

  <div class="tile placeholder" aria-disabled="true">
    <span class="icon-wrap">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="20" height="20" rx="4" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3.5"/>
      </svg>
    </span>
  </div>

  <div class="tile placeholder" aria-disabled="true">
    <span class="icon-wrap">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="20" height="20" rx="4" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3.5"/>
      </svg>
    </span>
  </div>

  <div class="tile placeholder" aria-disabled="true">
    <span class="icon-wrap">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="20" height="20" rx="4" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3.5"/>
      </svg>
    </span>
  </div>

  <div class="tile placeholder" aria-disabled="true">
    <span class="icon-wrap">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="20" height="20" rx="4" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3.5"/>
      </svg>
    </span>
  </div>

</div>

</body>
</html>
