<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiketten · bw-tools</title>
<style>
  :root {
    --bg: #050608;
    --panel: #121620;
    --panel-hover: #182030;
    --line: #242c38;
    --accent: #3e7bb6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .head {
    width: 100%; max-width: 760px;
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 22px;
  }
  .head a {
    color: #7c8899; text-decoration: none; font-size: 13px;
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px;
  }
  .head a:hover { color: #c7cfda; border-color: var(--accent); }
  .head h1 { margin: 0; font-size: 15px; font-weight: 600; color: #c7cfda; letter-spacing: .02em; }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: clamp(14px, 4vw, 26px);
    width: 100%; max-width: 760px;
  }
  @media (min-width: 480px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }

  .tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(6px, 1.8vw, 10px);
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    text-decoration: none;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  a.tile:hover, a.tile:focus-visible { background: var(--panel-hover); border-color: var(--accent); transform: translateY(-3px); }

  .tile .icon-wrap {
    width: 54%; height: 54%;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  .tile .icon-wrap svg { width: 100%; height: 100%; }

  .tile .tile-label {
    font-size: clamp(11px, 2.6vw, 14px);
    font-weight: 500;
    letter-spacing: .01em;
    color: #c7cfda;
    text-align: center;
    padding: 0 6px;
  }

  .tile.placeholder { background: transparent; border: 1.5px dashed var(--line); cursor: default; }
  .tile.placeholder .icon-wrap { color: #333d4a; }
</style>
</head>
<body>

<div class="head">
  <a href="/">‹ Start</a>
  <h1>Etiketten</h1>
</div>

<div class="grid">

  <a class="tile" href="paletten/">
    <span class="icon-wrap">
      <!-- Miniatur der Etikette selbst: Kopfzeile, grosse Inventar-Nr.,
           QR oben rechts, Foto rechts, Datenzeilen unten -->
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2.5" y="6.5" width="35" height="25" rx="1.8" stroke="currentColor" stroke-width="1.6"/>

        <!-- Kopfzeile: Eventname + Logo -->
        <rect x="10" y="8.8" width="12" height="2.2" rx="1.1" fill="currentColor"/>
        <path d="M29 8.8 L30.6 11.2 L32.2 8.8 L33.8 11.2 L35.4 8.8" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M2.5 13.4 H37.5" stroke="currentColor" stroke-width="1.2"/>

        <!-- grosse Inventar-Nr. + QR -->
        <rect x="5" y="15.6" width="11" height="4" rx="1" fill="currentColor"/>
        <path d="M20.5 13.4 V20.8" stroke="currentColor" stroke-width="1.2"/>
        <rect x="29.4" y="15" width="2.1" height="2.1" fill="currentColor"/>
        <rect x="33" y="15" width="2.1" height="2.1" fill="currentColor"/>
        <rect x="29.4" y="18.6" width="2.1" height="2.1" fill="currentColor"/>
        <rect x="33" y="18.6" width="1" height="1" fill="currentColor"/>
        <rect x="34.1" y="19.7" width="1" height="1" fill="currentColor"/>
        <path d="M2.5 22.4 H37.5" stroke="currentColor" stroke-width="1.2"/>

        <!-- Datenzeilen links, Foto rechts -->
        <rect x="5" y="24.4" width="9" height="1.6" rx="0.8" fill="currentColor" opacity=".55"/>
        <rect x="5" y="27.6" width="14" height="1.6" rx="0.8" fill="currentColor" opacity=".55"/>
        <rect x="25" y="23.6" width="10.5" height="6" rx="0.8" stroke="currentColor" stroke-width="1.3" opacity=".8"/>
        <path d="M25.6 28.4 L28.6 25.6 L31 27.8 L32.6 26.6 L34.9 28.8" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" opacity=".8"/>
      </svg>
    </span>
    <span class="tile-label">Paletten</span>
  </a>

  <div class="tile placeholder" aria-disabled="true">
    <span class="icon-wrap">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="20" height="20" rx="4" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3.5"/>
      </svg>
    </span>
  </div>

  <div class="tile placeholder" aria-disabled="true">
    <span class="icon-wrap">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="20" height="20" rx="4" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3.5"/>
      </svg>
    </span>
  </div>

  <div class="tile placeholder" aria-disabled="true">
    <span class="icon-wrap">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="20" height="20" rx="4" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3.5"/>
      </svg>
    </span>
  </div>

</div>

</body>
</html>
